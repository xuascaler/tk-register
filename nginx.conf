user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_shutdown_timeout 25s;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 3m;

    # Omit query strings, cookies, authorization and request bodies from logs.
    log_format tk '$remote_addr [$time_local] "$request_method $uri" '
                  '$status $body_bytes_sent $request_time';
    access_log /dev/stdout tk;

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate /etc/tk-register/tls/fullchain.pem;
        ssl_certificate_key /etc/tk-register/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TK_TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        location = / {
            return 302 /tk-register;
        }

        location ~ ^/tk-register(?:/|$) {
            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # The backend trusts this header. Always replace the client value.
            proxy_set_header X-TK-Client-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            # Credential updates include a bounded vendor write and an immediate
            # account refresh. Allow time for their final persistence response.
            proxy_read_timeout 90s;
            proxy_redirect off;
        }

        location / {
            return 404;
        }
    }
}
